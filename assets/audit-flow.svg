<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="330" viewBox="0 0 1120 330" role="img" aria-labelledby="title desc">
  <title id="title">SideEffect: a clear, evidence-led audit</title>
  <desc id="desc">Choose what to inspect, collect a bounded local snapshot, trace observations to their evidence, and compare audit runs.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111a29"/>
      <stop offset="1" stop-color="#0c1421"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset=".52" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#020617" flood-opacity=".24"/>
    </filter>
  </defs>

  <rect x="1" y="1" width="1118" height="328" rx="24" fill="url(#panel)" stroke="#29384c" stroke-width="2"/>
  <text x="36" y="48" fill="#f1f5f9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700">A clear path from scope to evidence</text>
  <text x="36" y="75" fill="#a8b6c8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">Every audit is user-triggered, local, and limited to its stated sources.</text>

  <path d="M282 174h30m-7-6 7 6-7 6M562 174h30m-7-6 7 6-7 6M842 174h30m-7-6 7 6-7 6" fill="none" stroke="url(#flow)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <g font-family="Inter,Segoe UI,Arial,sans-serif" text-anchor="middle">
    <g transform="translate(160 174)" filter="url(#shadow)">
      <rect x="-119" y="-72" width="238" height="139" rx="18" fill="#14242d" stroke="#245a5a"/>
      <circle cx="0" cy="0" r="35" fill="#10363a" stroke="#2dd4bf" stroke-width="2"/>
      <path d="M-12-10h24M-12 0h17M-12 10h20" fill="none" stroke="#99f6e4" stroke-width="3" stroke-linecap="round"/>
      <text x="0" y="-46" fill="#5eead4" font-size="13" font-weight="700" letter-spacing="1.4">01 · SCOPE</text>
      <text x="0" y="53" fill="#f1f5f9" font-size="21" font-weight="700">Choose scope</text>
      <text x="0" y="87" fill="#b8c7d8" font-size="15">Select what to inspect</text>
    </g>

    <g transform="translate(440 174)" filter="url(#shadow)">
      <rect x="-119" y="-72" width="238" height="139" rx="18" fill="#142435" stroke="#315775"/>
      <circle cx="0" cy="0" r="35" fill="#142f46" stroke="#60a5fa" stroke-width="2"/>
      <path d="M0-16v13m-6-6 6 6 6-6M-15 3h8l3 4h8l3-4h8v13h-30z" fill="none" stroke="#bfdbfe" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="0" y="-46" fill="#93c5fd" font-size="13" font-weight="700" letter-spacing="1.4">02 · COLLECT</text>
      <text x="0" y="53" fill="#f1f5f9" font-size="21" font-weight="700">Collect locally</text>
      <text x="0" y="87" fill="#b8c7d8" font-size="15">Bounded source snapshots</text>
    </g>

    <g transform="translate(720 174)" filter="url(#shadow)">
      <rect x="-119" y="-72" width="238" height="139" rx="18" fill="#1b2239" stroke="#484d83"/>
      <circle cx="0" cy="0" r="35" fill="#24294c" stroke="#818cf8" stroke-width="2"/>
      <path d="M-13-14h18v23h-18zM-9-8h10M-9-3h7M-9 2h3" fill="none" stroke="#c7d2fe" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="7" cy="6" r="8" fill="#24294c" stroke="#c7d2fe" stroke-width="2.5"/>
      <path d="m13 12 7 7" fill="none" stroke="#c7d2fe" stroke-width="3" stroke-linecap="round"/>
      <text x="0" y="-46" fill="#a5b4fc" font-size="13" font-weight="700" letter-spacing="1.2">03 · INSPECT</text>
      <text x="0" y="53" fill="#f1f5f9" font-size="21" font-weight="700">Follow evidence</text>
      <text x="0" y="87" fill="#b8c7d8" font-size="15">Open source-linked details</text>
    </g>

    <g transform="translate(1000 174)" filter="url(#shadow)">
      <rect x="-119" y="-72" width="238" height="139" rx="18" fill="#242239" stroke="#594782"/>
      <circle cx="0" cy="0" r="35" fill="#30294d" stroke="#a78bfa" stroke-width="2"/>
      <path d="M-14-11h10v22h-10zM4-11h10v22H4zM-2-5h4M-2 5h4" fill="none" stroke="#ddd6fe" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="0" y="-46" fill="#c4b5fd" font-size="13" font-weight="700" letter-spacing="1.2">04 · COMPARE</text>
      <text x="0" y="53" fill="#f1f5f9" font-size="21" font-weight="700">Compare runs</text>
      <text x="0" y="87" fill="#b8c7d8" font-size="15">Review changes with evidence</text>
    </g>
  </g>
</svg>
