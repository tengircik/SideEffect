[package]
name = "sideeffect"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
description = "Evidence-preserving inspection of strace text captures"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
