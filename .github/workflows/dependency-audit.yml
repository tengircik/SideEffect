name: Dependency audit

on:
  workflow_call:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Cargo.toml
      - Cargo.lock
      - deny.toml
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - deny.toml

permissions:
  contents: read

jobs:
  dependency-advisories:
    name: Dependency advisories
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install pinned cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Audit committed lockfile
        run: cargo audit --file Cargo.lock

  dependency-licenses:
    name: Dependency licenses
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install stable Rust toolchain for cargo-deny
        run: rustup toolchain install stable --profile minimal

      - name: Install pinned cargo-deny
        run: cargo +stable install cargo-deny --version 0.20.2 --locked

      - name: Check declared dependency licenses
        run: cargo +stable deny check licenses
