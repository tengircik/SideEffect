name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  dependency-advisories:
    name: Dependency advisories
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install pinned cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Audit committed lockfile
        run: cargo audit --file Cargo.lock

  linux:
    name: Linux
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install Rust components
        run: rustup component add rustfmt clippy

      - name: Install strace
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y strace python3

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run tests, including real child, file, and loopback capture
        run: cargo test --locked --all-targets

      - name: Build CLI
        run: cargo build --locked --bin sideeffect

      - name: Build optimized release CLI
        run: cargo build --locked --release --bin sideeffect

      - name: Smoke-check optimized release CLI
        run: |
          ./target/release/sideeffect --help
          ./target/release/sideeffect --version

  msrv:
    name: Linux MSRV (Rust 1.85)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install Rust 1.85 toolchain
        run: rustup toolchain install 1.85.0 --profile minimal --component rustfmt --component clippy

      - name: Install strace
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y strace python3

      - name: Check formatting with Rust 1.85
        run: cargo +1.85.0 fmt --all --check

      - name: Run Clippy with Rust 1.85
        run: cargo +1.85.0 clippy --locked --all-targets -- -D warnings

      - name: Run tests with Rust 1.85, including real capture
        run: cargo +1.85.0 test --locked --all-targets

      - name: Build CLI with Rust 1.85
        run: cargo +1.85.0 build --locked --bin sideeffect

  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install Rust components
        run: rustup component add rustfmt clippy

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --locked --all-targets

      - name: Build CLI
        run: cargo build --locked --bin sideeffect
