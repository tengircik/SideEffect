name: CI

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  trace-parser-fuzz-smoke:
    name: Trace parser fuzz smoke (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install nightly Rust and cargo-fuzz
        run: |
          rustup toolchain install nightly --profile minimal
          cargo install cargo-fuzz --locked --version 0.12.0

      - name: Run bounded parser fuzz smoke
        run: |
          cargo +nightly fuzz run parse_trace_bytes -- -runs=100 -max_len=65536
          cargo +nightly fuzz run inspect_windows_runtime_bytes -- -runs=100 -max_len=65536

  strace-minimum-compatibility:
    name: Linux strace compatibility (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install strace and integration-test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y strace python3

      - name: Check and report installed strace version
        shell: bash
        run: |
          strace --version
          version="$(strace --version | sed -nE '1s/^strace -- version ([0-9]+\.[0-9]+).*$/\1/p')"
          if [[ -z "$version" ]]; then
            echo "Could not parse the installed strace major.minor version" >&2
            exit 1
          fi
          echo "Installed strace version: $version (required: 6.8 or newer)"
          if ! dpkg --compare-versions "$version" ge 6.8; then
            echo "strace $version is older than the supported minimum 6.8" >&2
            exit 1
          fi

      - name: Run real strace capture integration test
        run: cargo test --locked --test record_observations real_strace_capture_inspect_and_diff_observe_file_and_loopback_events -- --exact

      - name: Run concurrent child-process strace integration test
        run: cargo test --locked --test record_observations real_strace_capture_observes_two_concurrent_child_processes -- --exact

      - name: Run distinct-thread strace integration test
        run: cargo test --locked --test record_observations real_strace_capture_attributes_file_operations_to_distinct_threads -- --exact

      - name: Run real refused-connect capture integration test
        run: cargo test --locked --test record_observations real_strace_capture_reports_refused_loopback_connection_as_failed_attempt -- --exact

      - name: Run real strace cancellation and tracee cleanup integration test
        run: cargo test --locked --test record_observations real_strace_capture_cancellation_discards_partial_trace_and_reaps_tracee -- --exact

      - name: Run startup correlation against a real strace capture
        run: cargo test --locked --test startup_correlation_real_strace real_strace_capture_can_match_a_synthetic_literal_startup_row -- --exact

  linux:
    name: Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install Rust components
        run: rustup component add rustfmt clippy

      - name: Install strace
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y strace python3

      - name: Validate portable agent skill
        run: python3 scripts/validate_agent_skill.py

      - name: Validate local explanation evaluator contracts
        run: |
          python3 tests/test_local_model_explain_evaluator.py
          python3 tests/test_local_model_explain_review_packet.py
          python3 tests/test_run_local_model_explain_corpus.py

      - name: Validate local query-plan v3 development contracts
        run: |
          python3 tests/fixtures/local_query_plan_v3_development/validate_corpus.py
          python3 -m unittest discover -s tests/fixtures/local_query_plan_v3_development -p 'test_*.py' -v
          python3 scripts/test_evaluate_local_query_plan_v3.py

      - name: Validate native Windows ETW query development corpus
        run: |
          python3 scripts/evaluate_local_model_windows_etw_query.py --check-corpus
          python3 tests/test_local_model_windows_etw_query.py
          python3 tests/test_run_local_model_windows_etw_query_corpus.py

      - name: Test Linux release archive smoke validator
        run: python3 tests/test_smoke_linux_release_archive.py

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run tests, including real child, file, and loopback capture
        run: cargo test --locked --all-targets

      - name: Build CLI
        run: cargo build --locked --bin sideeffect

      - name: Build optimized release CLI
        run: cargo build --locked --release --bin sideeffect

      - name: Smoke-check optimized release CLI
        run: |
          ./target/release/sideeffect --help
          ./target/release/sideeffect --version

      - name: Measure bounded native Linux trace performance
        run: |
          python3 scripts/trace_scale_benchmark.py \
            --sideeffect target/release/sideeffect \
            --profile getpid --sizes 1000,10000 \
            --runs 2 --warmups 0 \
            --output "$RUNNER_TEMP/trace-scale-ci.json" \
            > "$RUNNER_TEMP/trace-scale-stdout.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(Path(os.environ["RUNNER_TEMP"], "trace-scale-ci.json").read_text())
          failed = [case["requested_records"] for case in report["matrix"]
                    if case.get("status") != "measured"]
          if failed:
              raise SystemExit(f"benchmark did not completely measure requested sizes: {failed}")
          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          with summary.open("a", encoding="utf-8") as stream:
              stream.write("\n### Bounded Linux trace performance sample\n\n")
              stream.write("Native Ubuntu 24.04 hosted runner; generated local `getpid` workload; two measured captures per size, no warm-up. This is a reproducibility smoke sample, not a general performance claim.\n\n")
              stream.write("| Requested rows | Run | Parsed rows | Trace bytes | Capture wall (s) | Capture child CPU (s) | Capture sampled peak process-group RSS (bytes) | Inspect JSON bytes | Inspect wall (s) | Inspect child CPU (s) | Inspect sampled peak process-group RSS (bytes) |\n")
              stream.write("|---:|---:|---:|---:|---:|---:|---:|---:|---:|---:|---:|\n")
              for case in report["matrix"]:
                  for index, run in enumerate(case.get("runs", []), 1):
                      capture = run.get("capture", {})
                      inspect = run.get("inspect", {})
                      capture_cpu = capture.get("child_cpu_seconds", {})
                      inspect_cpu = inspect.get("child_cpu_seconds", {})
                      stream.write(
                          f"| {case['requested_records']} | {index} | {inspect.get('parsed_records', '—')} "
                          f"| {capture.get('trace_bytes', '—')} | {capture.get('wall_seconds', '—')} "
                          f"| {capture_cpu.get('user', 0) + capture_cpu.get('system', 0):.6f} "
                          f"| {capture.get('sampled_peak_process_group_rss_bytes', '—')} "
                          f"| {inspect.get('json_bytes', '—')} | {inspect.get('wall_seconds', '—')} "
                          f"| {inspect_cpu.get('user', 0) + inspect_cpu.get('system', 0):.6f} "
                          f"| {inspect.get('sampled_peak_process_group_rss_bytes', '—')} |\n"
                      )
          PY
      - name: Smoke-check Cargo installation
        run: |
          cargo install --locked --path . --root "$RUNNER_TEMP/sideeffect-install"
          "$RUNNER_TEMP/sideeffect-install/bin/sideeffect" version

  agent-skill-install:
    name: Agent Skill installation (supported coding agents)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Node.js 22.20
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.20.0

      - name: Install the skill into isolated agent profiles
        env:
          HOME: ${{ runner.temp }}/sideeffect-agent-home
          DISABLE_TELEMETRY: "1"
          DO_NOT_TRACK: "1"
        run: |
          mkdir -p "$HOME"
          npx --yes skills@1.7.4 add \
            https://github.com/tengircik/SideEffect/tree/ea7c5ef17ca16263afb62026e36c42d135bf6de8/.agents/skills/sideeffect-audit \
            --skill sideeffect-audit \
            --agent codex --agent claude-code --agent cursor \
            --agent gemini-cli --agent github-copilot --agent opencode \
            --agent windsurf \
            --global --copy --yes

      - name: Verify each native skill installation
        env:
          HOME: ${{ runner.temp }}/sideeffect-agent-home
        run: |
          source="$GITHUB_WORKSPACE/.agents/skills/sideeffect-audit"
          for installed in \
            "$HOME/.agents/skills/sideeffect-audit" \
            "$HOME/.claude/skills/sideeffect-audit" \
            "$HOME/.codeium/windsurf/skills/sideeffect-audit"; do
            test -f "$installed/SKILL.md"
            diff -qr "$source" "$installed"
          done

  msrv:
    name: Linux MSRV (Rust 1.85)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install Rust 1.85 toolchain
        run: rustup toolchain install 1.85.0 --profile minimal --component rustfmt --component clippy

      - name: Install strace
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y strace python3

      - name: Check formatting with Rust 1.85
        run: cargo +1.85.0 fmt --all --check

      - name: Run Clippy with Rust 1.85
        run: cargo +1.85.0 clippy --locked --all-targets -- -D warnings

      - name: Run tests with Rust 1.85, including real capture
        run: cargo +1.85.0 test --locked --all-targets

      - name: Build CLI with Rust 1.85
        run: cargo +1.85.0 build --locked --bin sideeffect

  windows:
    name: Windows (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Parse Windows local runtime installer
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'scripts/install_sideeffect_llama_runtime_windows.ps1'),
            [ref] $tokens,
            [ref] $parseErrors
          ) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | Format-List *
            exit 1
          }

      - name: Report Windows version
        shell: pwsh
        run: |
          $os = Get-CimInstance -ClassName Win32_OperatingSystem
          Write-Output "Windows caption: $($os.Caption)"
          Write-Output "Windows version: $($os.Version)"
          Write-Output "Windows build: $($os.BuildNumber)"

      - name: Install Rust components
        run: rustup component add rustfmt clippy

      - name: Validate local explanation evaluator contracts
        shell: pwsh
        run: |
          py -3 tests/test_local_model_explain_evaluator.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          py -3 tests/test_local_model_explain_review_packet.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          py -3 tests/test_run_local_model_explain_corpus.py

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --locked --all-targets

      - name: Verify live ETW acceptance prerequisites
        shell: pwsh
        run: |
          $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
          $principal = [Security.Principal.WindowsPrincipal]::new($identity)
          if (-not $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) {
            throw "Live ETW acceptance requires an already-administrative Windows runner token."
          }
          Write-Output "ETW acceptance runner token is administrative: $($identity.Name)"

      - name: Run Windows Server 2022/2025 ETW acceptance and diagnostic sample
        env:
          SIDEEFFECT_ETW_DIAGNOSTIC_SAMPLE: windows_server_hosted_ci
        run: cargo test --locked --test windows_runtime_etw_integration -- --ignored --exact captures_process_file_and_loopback_network_observations_and_reports_loss_state --nocapture

      - name: Build CLI
        run: cargo build --locked --bin sideeffect

      - name: Smoke-check Cargo installation
        shell: pwsh
        run: |
          $installRoot = Join-Path $env:RUNNER_TEMP "sideeffect-install"
          cargo install --locked --path . --root $installRoot
          & (Join-Path $installRoot "bin\sideeffect.exe") version
