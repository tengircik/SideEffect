[package]
name = "sideeffect-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
sideeffect = { path = ".." }

[[bin]]
name = "parse_trace_bytes"
path = "fuzz_targets/parse_trace_bytes.rs"
test = false
doc = false
bench = false

[[bin]]
name = "inspect_windows_runtime_bytes"
path = "fuzz_targets/inspect_windows_runtime_bytes.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
